<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="About me">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#14223B"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A1F"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="64" rx="12"/></clipPath>
    <style>
      .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Cascadia Code', Consolas, Menlo, monospace; }
      .ln { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.6s ease-out forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
      .dot { animation: p 2s ease-in-out infinite; }
      @keyframes p { 50% { opacity: .25 } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="64" fill="url(#g)"/>
    <rect width="5" height="64" fill="#FF8A1F"/>
  </g>
  <text class="m" x="30" y="40" font-size="15" fill="#FF8A1F" letter-spacing="1">01</text>
  <text class="f" x="66" y="42" font-size="24" font-weight="700" fill="#FFFFFF">About me</text>
  <rect class="ln" x="198" y="31" width="942" height="2" fill="url(#l)"/>
  <circle class="dot" cx="1170" cy="32" r="4" fill="#FF8A1F"/>
</svg>
