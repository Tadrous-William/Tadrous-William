<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="Tech stack">
  <defs>
    <style>
      .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .in { opacity: 0; animation: in .7s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateX(-12px) } to { opacity: 1; transform: none } }
      .ln { stroke-dasharray: 920; stroke-dashoffset: 920; animation: draw 1.4s .4s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0 } }
      .run { animation: run 4.5s 1.8s ease-in-out infinite; opacity: 0; }
      @keyframes run { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { transform: translateX(920px); opacity: 0 } }
      .badge { transform-box: fill-box; transform-origin: center; animation: pop .5s ease-out both; }
      @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.12) } 100% { transform: scale(1); opacity: 1 } }
    </style>
  </defs>
  <rect x=".5" y=".5" width="1199" height="69" rx="14" fill="#FBF8F3" stroke="#EDE5D8"/>
  <g class="badge"><circle cx="40" cy="35" r="19" fill="#DDEFFC"/></g>
  <text class="f" x="40" y="41" text-anchor="middle" font-size="15" font-weight="800" fill="#0369A1">04</text>
  <text class="f in" x="76" y="44" font-size="25" font-weight="800" fill="#1C1917" letter-spacing="-.3">Tech stack</text>
  <line class="ln" x1="240" y1="35" x2="1160" y2="35" stroke="#0369A1" stroke-opacity=".35" stroke-width="2" stroke-dasharray="920" stroke-linecap="round"/>
  <circle class="run" cx="240" cy="35" r="4.5" fill="#0369A1"/>
</svg>
