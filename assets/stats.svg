<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="100% Job Success, 5.0 rating, 3rd place nationally at DEPI, 30 of 30 RAG chatbot test">
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C5A3A" flood-opacity=".10"/>
    </filter>
    <style>
      .f { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .c { opacity: 0; animation: in .7s ease-out forwards; }
      .c2 { animation-delay: .15s } .c3 { animation-delay: .3s } .c4 { animation-delay: .45s }
      @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

      .ring { stroke-dasharray: 157; stroke-dashoffset: 157; animation: ring 1.6s .6s ease-out forwards; }
      .ring2 { animation-delay: 1.1s }
      @keyframes ring { to { stroke-dashoffset: 0 } }

      .star { opacity: .18; animation: star .35s ease-out forwards; transform-box: fill-box; transform-origin: center; }
      .s1 { animation-delay: .9s } .s2 { animation-delay: 1.1s } .s3 { animation-delay: 1.3s } .s4 { animation-delay: 1.5s } .s5 { animation-delay: 1.7s }
      @keyframes star { 0% { opacity: .18; transform: scale(.6) } 70% { transform: scale(1.25) } 100% { opacity: 1; transform: scale(1) } }

      .pod { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise .8s ease-out forwards; }
      .p1 { animation-delay: .9s } .p2 { animation-delay: 1.1s } .p3 { animation-delay: 1.3s }
      @keyframes rise { to { transform: scaleY(1) } }
      .glow { animation: glow 2.2s 2s ease-in-out infinite; }
      @keyframes glow { 50% { opacity: .55 } }

      .tick { stroke-dasharray: 30; stroke-dashoffset: 30; animation: ring .5s 2.4s ease-out forwards; }
    </style>
  </defs>

  <!-- 100% job success -->
  <g class="c">
    <rect x="6" y="4" width="276" height="122" rx="16" fill="#FFFFFF" stroke="#EDE5D8" filter="url(#sh)"/>
    <text class="f" x="30" y="64" font-size="42" font-weight="800" fill="#1C1917">100%</text>
    <text class="f" x="30" y="94" font-size="15" fill="#78716C">Job Success on Upwork</text>
    <circle cx="236" cy="62" r="25" fill="none" stroke="#FFEAD8" stroke-width="7"/>
    <circle class="ring" cx="236" cy="62" r="25" fill="none" stroke="#F97316" stroke-width="7" stroke-linecap="round" transform="rotate(-90 236 62)"/>
  </g>

  <!-- 5.0 rating -->
  <g transform="translate(306 0)"><g class="c c2">
    <rect x="6" y="4" width="276" height="122" rx="16" fill="#FFFFFF" stroke="#EDE5D8" filter="url(#sh)"/>
    <text class="f" x="30" y="64" font-size="42" font-weight="800" fill="#1C1917">5.0</text>
    <text class="f" x="30" y="94" font-size="15" fill="#78716C">Every rated client job</text>
    <g fill="#F59E0B">
      <path class="star s1" d="M118 34 l3.5 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7 -3.7 -7 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z"/>
      <path class="star s2" d="M144 34 l3.5 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7 -3.7 -7 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z"/>
      <path class="star s3" d="M170 34 l3.5 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7 -3.7 -7 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z"/>
      <path class="star s4" d="M196 34 l3.5 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7 -3.7 -7 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z"/>
      <path class="star s5" d="M222 34 l3.5 7.2 7.9 1.1 -5.7 5.6 1.3 7.9 -7 -3.7 -7 3.7 1.3 -7.9 -5.7 -5.6 7.9 -1.1z"/>
    </g>
  </g></g>

  <!-- 3rd place -->
  <g transform="translate(612 0)"><g class="c c3">
    <rect x="6" y="4" width="276" height="122" rx="16" fill="#FFFFFF" stroke="#EDE5D8" filter="url(#sh)"/>
    <text class="f" x="30" y="64" font-size="42" font-weight="800" fill="#1C1917">3rd</text>
    <text class="f" x="30" y="94" font-size="15" fill="#78716C">Nationally at DEPI, team lead</text>
    <rect class="pod p1" x="196" y="44" width="20" height="36" rx="4" fill="#E7E5E4"/>
    <rect class="pod p2" x="219" y="32" width="20" height="48" rx="4" fill="#E7E5E4"/>
    <rect class="pod p3" x="242" y="54" width="20" height="26" rx="4" fill="#5EC4A0"/>
    <rect class="glow" x="242" y="54" width="20" height="26" rx="4" fill="#A7F3D0" opacity="0"/>
    <text class="f" x="252" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">3</text>
  </g></g>

  <!-- 30/30 -->
  <g transform="translate(918 0)"><g class="c c4">
    <rect x="6" y="4" width="276" height="122" rx="16" fill="#FFFFFF" stroke="#EDE5D8" filter="url(#sh)"/>
    <text class="f" x="30" y="64" font-size="42" font-weight="800" fill="#1C1917">30<tspan font-size="24" fill="#A8A29E" dx="4">/ 30</tspan></text>
    <text class="f" x="30" y="94" font-size="15" fill="#78716C">RAG chatbot test score</text>
    <circle cx="236" cy="62" r="25" fill="none" stroke="#DCF5E7" stroke-width="7"/>
    <circle class="ring ring2" cx="236" cy="62" r="25" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" transform="rotate(-90 236 62)"/>
    <path class="tick" d="M226 62 l7 7 l12 -13" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</svg>
